services:
    # Register the optional core integration only when the API bundle is enabled.
    contao.api.widget.row_wizard_converter:
        class: Contao\CoreBundle\Api\Widget\RowWizardConverter
        arguments:
            - '@contao_api.widget.converter_registry'
            - '@contao_api.schema.data_container_factory'
        tags:
            - { name: contao.api.widget_converter, priority: -100 }

    contao.api.widget_converter:
        class: Contao\CoreBundle\Api\Widget\CoreWidgetConverter
        arguments:
            - '@contao.widget.date_value_formatter'
        tags:
            - { name: contao.api.widget_converter, priority: -100 }
