tl_user:
    username:
        0: Username
        1: Please enter a unique username.
    name:
        0: Name
        1: Please enter the first and last name.
    email:
        0: E-mail address
        1: Please enter a valid e-mail address.
    language:
        0: Back end language
        1: Here you can choose the back end language.
    backendWidth:
        0: Maximum width
        1: Here you can limit the width of the back end container.
    uploader:
        0: File uploader
        1: Here you can choose a file uploader.
    showHelp:
        0: Show explanation
        1: Show a short explanation text below each input field.
    thumbnails:
        0: Show thumbnail images
        1: Show thumbnail images in the file manager.
    useRTE:
        0: Enable the rich text editor
        1: Use the rich text editor to format text elements.
    useCE:
        0: Enable the code editor
        1: Use the code editor to modify code elements.
    doNotCollapse:
        0: Do not collapse content elements
        1: Do not collapse content elements in the back end preview.
    doNotHideMessages:
        0: Keep pop-up messages
        1: Do not automatically hide pop-up messages.
    pwChange:
        0: Password change required
        1: Make the user change his password upon the next login.
    admin:
        0: Make the user an administrator
        1: Administrators have unlimited access to all modules and elements!
    groups:
        0: User groups
        1: Here you can assign the user to one or more groups.
    inherit:
        0: Permission inheritance
        1: Here you can define which group permissions the user inherits.
    group:
        0: Use group settings only
        1: The user inherits only group permissions.
    extend:
        0: Extend group settings
        1: The group permissions are extended by individual ones.
    custom:
        0: Use individual settings only
        1: Only individual permissions are applied.
    modules:
        0: Back end modules
        1: Here you can grant access to one or more back end modules.
    themes:
        0: Theme modules
        1: Here you can grant access to the theme modules.
    elements:
        0: Content elements
        1: Here you can select the allowed content element types.
    fields:
        0: Form fields
        1: Here you can select the allowed form field types.
    frontendModules:
        0: Front end modules
        1: Here you can select the allowed front end module types.
    pagemounts:
        0: Pagemounts
        1: Here you can grant access to one or more pages (subpages are included automatically).
    alpty:
        0: Allowed page types
        1: Here you can select the page types you want to allow.
    filemounts:
        0: Filemounts
        1: Here you can grant access to one or more folders (subfolders will be included automatically).
    imageSizes:
        0: Image sizes
        1: Here you can grant access to one or more image sizes.
    forms:
        0: Allowed forms
        1: Here you can grant access to one or more forms.
    amg:
        0: Allowed member groups
        1: Members of these groups can be used in the front end preview.
    cud:
        0: Table permissions
        1: Here you can select which operations are allowed for which table.
        create: Create
        update: Update
        delete: Delete
        other: Additional permissions
        table_create: Create records in "%s"
        table_update: Update records of "%s"
        table_delete: Delete records of "%s"
    disable:
        0: Deactivate
        1: Temporarily disable the account.
    start:
        0: Activate on
        1: If you want to prevent the account from being active before a certain date/time, you can enter it here. Otherwise, leave the field blank.
    stop:
        0: Deactivate on
        1: If you want to prevent the account from being active after a certain date/time, you can enter it here. Otherwise, leave the field blank.
    session:
        0: Purge data
        1: Please select the data you want to purge.
    name_legend: Name and e-mail
    backend_legend: Back end settings
    password_legend: Password settings
    admin_legend: Administrator
    groups_legend: User groups
    modules_legend: Allowed modules
    elements_legend: Allowed elements
    pagemounts_legend: Pagemounts
    filemounts_legend: Filemounts
    imageSizes_legend: Image sizes
    forms_legend: Form permissions
    amg_legend: Allowed member groups
    cud_legend: Table permissions
    account_legend: Account settings
    session_legend: Clear cache
    sessionLabel: Session data
    htmlLabel: Image cache
    previewLabel: Preview cache
    tempLabel: Shared cache
    sessionPurged: The session data has been purged
    htmlPurged: The image cache has been purged
    previewPurged: The preview cache has been purged
    tempPurged: The shared cache has been purged
    FileUpload: Default uploader
    useTwoFactor: Use two-factor authentication
    new:
        1: Create a new user
    show:
        1: Show the details of user ID %s
    versions:
        1: Show the versions of user ID %s
    edit:
        1: Edit user ID %s
    copy:
        0: Duplicate
        1: Duplicate user ID %s
    delete:
        1: Delete user ID %s
    toggle:
        0: Activate/deactivate user
        1: Deactivate user ID %s
        2: Activate user ID %s
        3: Deactivate
        4: Activate
    su:
        0: Switch user
        1: Switch to user ID %s
    tableLabel: User
