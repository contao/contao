        4: Unhide
    pasteafter:
        1: Paste after content element ID %s
    pastenewtop:
        1: Create a new content element at the top
    pastenewafter:
        1: Create a new content element after content element ID %s
    editalias: Edit the source element ID %s
    list:
        1: Import list items from a CSV file
    table:
        1: Import table items from a CSV file
    dl_label:
        0: Description list items
        1: Please enter a list of terms and details for the description list. You can leave the term field empty to create multiple details for one term.
    dl_key: Term
    dl_value: Details
    redirect_legend: Redirect settings
    jumpTo:
        0: Redirect page
        1: Please choose the page to which visitors will be redirected when clicking a link or submitting a form.
    redirectBack:
        0: Redirect to last page visited
        1: Redirect the member back to the last page visited instead of the redirect page.
    config_legend: Element configuration
    autologin:
        0: Allow auto login
        1: Allow members to log into the front end automatically.
    pwResetPage:
        0: Reset password page
        1: Here you can choose a page to which visitors will be redirected when clicking the <em>Forgot your password?</em> link.
    reg_close:
        0: Mode
        1: Here you can define how to handle the deletion.
    reg_deleteDir:
        0: Delete home directory
        1: Delete the home directory when the account is deleted.
    close_deactivate: Deactivate account
    close_delete: Irrevocably delete account
    tableLabel: Content element
