tl_content:
    type:
        0: Element type
        1: Please choose the type of content element.
    title:
        0: Internal title
        1: An optional title used, for example, in the back end preview and the breadcrumb menu.
    headline:
        0: Headline
        1: Here you can add a headline to the content element.
    sectionHeadline:
        0: Section headline
        1: Here you can add a section headline, e.g. a tab title or accordion header.
    text:
        0: Text
        1: You can use HTML tags to format the text.
    addImage:
        0: Add an image
        1: Add an image to the content element.
    showPreview:
        0: Show preview images
        1: Show preview images of the selected files.
    inline:
        0: Show in browser
        1: Show the file in the browser instead of opening the download dialog.
    overwriteMeta:
        0: Overwrite metadata
        1: Overwrite the metadata of the file.
    singleSRC:
        0: Source file
        1: Please select a file or folder from the files directory.
    alt:
        0: Alternate text
        1: Here you can enter an alternate text for the image (<em>alt</em> attribute).
    imageTitle:
        0: Image title
        1: Here you can enter the image title (<em>title</em> attribute).
    imageUrl:
        0: Image link target
        1: A custom image link target will override the lightbox link, so the image cannot be viewed fullsize anymore.
    fullsize:
        0: Full-size view/new window
        1: Open the full-size image in a lightbox or the link in a new browser window.
    floating:
        0: Image alignment
        1: Please specify how to align the image.
    caption:
        0: Image caption
        1: Here you can enter a short text that will be displayed below the image.
    html:
        0: HTML code
        1: You can modify the list of allowed HTML tags in the back end settings.
    unfilteredHtml:
        0: HTML code
        1: Take care when pasting things you don't understand. This could allow attackers to steal your identity or take control of the whole system.
    listtype:
        0: List type
        1: Please choose the type of list.
    listitems:
        0: List items
        1: If JavaScript is disabled, make sure to save your changes before modifying the order.
    tableitems:
        0: Table items
        1: If JavaScript is disabled, make sure to save your changes before modifying the order.
    summary:
        0: Table summary
        1: Please enter a short summary of the table and describe its purpose or structure.
    thead:
        0: Add table header
        1: Make the first row the table header.
    tfoot:
        0: Add table footer
        1: Make the last row the table footer.
    tleft:
        0: Use row headers
        1: Define the left column as row header.
    sortable:
        0: Sortable table
        1: Make the table sortable (requires JavaScript and a table header).
    sortIndex:
        0: Sort index
        1: The number of the default sort column.
    sortOrder:
        0: Sort order
        1: Please choose the sort order.
    closeSections:
        0: Close all sections
        1: Do not open the first section by default.
    mooType:
        0: Operation mode
        1: Please select the operation mode of the accordion element.
    mooStart:
        0: Wrapper start
        1: Marks the beginning of an accordion pane that spans several content elements.
    mooStop:
        0: Wrapper stop
        1: Marks the end of an accordion pane that spans several content elements.
    mooSingle:
        0: Single element
        1: Behaves like a single text element that is inside an accordion pane.
    mooHeadline:
        0: Section headline
        1: Please enter the headline of the content pane. HTML tags are allowed.
    mooStyle:
        0: CSS format
        1: Here you can format the section headline using CSS code.
    mooClasses:
        0: Element classes
        1: Leave blank to use the default classes or enter a custom toggler and accordion class.
    shClass:
        0: Configuration
        1: 'Here you can configure the syntax highlighter (e.g. <em>gutter: false;</em>).'
    highlight:
        0: Syntax highlighting
        1: Please choose a scripting language.
    code:
        0: Code
        1: Note that the code will not be executed. Use F11 to toggle the fullscreen mode if you are using the code editor.
    markdownSource:
        0: Markdown source
        1: Please choose the Markdown source.
        sourceText: Text
        sourceFile: File
    data:
        0: Template data
        1: These values are available as <code>$this->keys</code> in the template.
    linkTitle:
        0: Link text
        1: The link text will be displayed instead of the target URL.
    overwriteLink:
        0: Overwrite link
        1: Set a custom link text and link title.
    titleText:
        0: Link title
        1: The link title is added as <em>title</em> attribute in the HTML markup.
    embed:
        0: Embed the link
        1: Use the wildcard "%s" to embed the link in a phrase (e.g. <em>For more information please visit %s</em>).
    rel:
        0: Lightbox
        1: To trigger the lightbox, enter a <em>data-lightbox</em> attribute here.
    useImage:
        0: Create an image link
        1: Use an image instead of the link title.
    multiSRC:
        0: Source files
        1: Please select one or more files or folders from the files directory. If you select a folder, its files will be included automatically.
    useHomeDir:
        0: Use home directory
        1: Use the home directory as file source if there is an authenticated member.
    perRow:
        0: Thumbnails per row
        1: The number of image thumbnails per row.
    perPage:
        0: Items per page
        1: The number of items per page. Set to 0 to disable pagination.
    serverPagination:
        0: Server-side pagination
        1: Split the images across multiple pages and render only a subset at a time.
    sortBy:
        0: Order by
        1: Please choose the sort order.
    metaIgnore:
        0: Ignore files without metadata
        1: Do not show files without metadata matching the page language.
    galleryTpl:
        0: Gallery template
        1: Here you can select a gallery template.
    customTpl:
        0: Content element template
        1: Here you can select the content element template.
    playerSRC:
        0: Video/audio files
        1: Here you can add the video/audio file or multiple files if you are using different codecs.
    textTrackSRC:
        0: Text track files
        1: The topmost .vtt file is loaded as the default track. Additional settings can be made within the .vtt file.
    youtube:
        0: YouTube ID
        1: Please enter the YouTube video ID (e.g. <em>j0sYj4wxyk0</em>).
    vimeo:
        0: Vimeo ID
        1: Please enter the Vimeo video ID (e.g. <em>275028611</em>).
    posterSRC:
        0: Preview image
        1: Show this image instead of the first frame of the video before playback.
    playerSize:
        0: Player size
        1: Width and height of the media player in pixels (e.g. 640x360).
    playerOptions:
        0: Player options
        1: Here you can select the player options.
    playerPreload:
        0: Preloading
        1: Here you can suggest how the browser shall preload the video.
    playerStart:
        0: Start at
        1: Start playing the video at the given number of seconds. Set to 0 to disable.
    playerStop:
        0: Stop at
        1: Stop playing the video at the given number of seconds. Set to 0 to disable.
    playerTitle:
        0: Title
        1: Here you can enter a title.
    playerCaption:
        0: Caption
        1: Here you can enter a caption.
    playerAspect:
        0: Aspect ratio
        1: Here you can select the aspect ratio of the video to make it responsive.
    splashImage:
        0: Use a splash image
        1: Only load the video after the user has clicked on the splash image.
    playerColor:
        0: Controls color
        1: Here you can enter a hexadecimal color (e.g. ff0000) for the video controls.
    sliderDelay:
        0: Sliding interval
        1: The time in milliseconds between slides (1000 = 1s). Set to 0 to disable auto sliding.
    sliderSpeed:
        0: Transition speed
        1: The transition speed in milliseconds (1000 = 1s). Defaults to 300.
    sliderStartSlide:
        0: Slide offset
        1: Here you can make the slider start with a particular slide (counting starts at 0).
    sliderContinuous:
        0: Continuous
        1: Make the slider continuous (start all over when reaching the end).
    cteAlias:
        0: Referenced element
        1: Please choose the content element you want to insert.
    articleAlias:
        0: Referenced article
        1: Please choose the article you want to insert.
    article:
        0: Article
        1: Please select an article.
    form:
        0: Form
        1: Please select a form.
    module:
        0: Module
        1: Please select a module.
    protected:
        0: Protect element
        1: Show the content element to certain member groups only.
    groups:
        0: Allowed member groups
        1: These groups will be able to see the content element.
    cssID:
        0: CSS ID/class
        1: Here you can set an ID and one or more classes.
    invisible:
        0: Invisible
        1: Hide the element on the website.
    start:
        0: Show from
        1: If you want to prevent the element from showing on the website before a certain date/time, you can enter it here. Otherwise, leave the field blank.
    stop:
        0: Show until
        1: If you want to prevent the element from showing on the website after a certain date/time, you can enter it here. Otherwise, leave the field blank.
    tstamp:
        0: Revision date
        1: Date and time of the latest revision
    rootPageDependentElements:
        0: Elements
        1: Please select an element for every website root page.
    rootPageDependentElementsBlankOptionLabel: Choose element for "%s" [%s]
