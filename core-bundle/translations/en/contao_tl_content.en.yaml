    unordered: unordered list
    name_asc: File name (ascending)
    name_desc: File name (descending)
    date_asc: Date (ascending)
    date_desc: Date (descending)
    custom: Custom order
    random: Random order
    includeTemplate: The <em>%s</em> template needs to be included in the page layout.
    includeTemplates: The <em>%s</em> or <em>%s</em> template needs to be included in the page layout.
    player_autoplay: Autoplay
    player_nocontrols: Hide the controls
    player_loop: Play in a loop
    player_muted: Mute the audio output
    player_playsinline: Play inline (no fullscreen mode)
    player_preload:
        auto: Auto (preload the entire video)
        metadata: Metadata (preload the metadata only)
        none: None (do not preload anything)
    youtube_autoplay: Autoplay
    youtube_controls: Hide the controls
    youtube_cc_load_policy: Show captions by default
    youtube_fs: Hide the fullscreen button
    youtube_hl: Use the Contao page language
    youtube_iv_load_policy: Hide annotations
    youtube_modestbranding: Hide the YouTube logo
    youtube_rel: Limit related videos to the same channel
    youtube_nocookie: Use the youtube-nocookie.com domain
    youtube_loop: Loop video
    youtube_mute: Mute the audio output
    vimeo_autoplay: Autoplay
    vimeo_loop: Play in a loop
    vimeo_portrait: Hide the profile image
    vimeo_title: Hide the title
    vimeo_byline: Hide the author
    vimeo_dnt: Prevent session data tracking
    new:
        1: Add a new content element
    show:
        1: Show the details of content element ID %s
    versions:
        1: Show the versions of content element ID %s
    cut:
        1: Move content element ID %s
    copy:
        1: Copy content element ID %s
    delete:
        1: Delete content element ID %s
    edit:
        1: Edit content element ID %s
    toggle:
        0: Hide/unhide content element
        1: Hide content element ID %s
        2: Unhide content element ID %s
