tl_module:
    name:
        0: Internal title
        1: Please enter the module title.
    headline:
        0: Headline
        1: Here you can add a headline to the module.
    type:
        0: Module type
        1: Please choose the type of module.
    ariaLabel:
        0: ARIA label
        1: If there is more than one navigation element on the page, each should have a unique label.
    levelOffset:
        0: Start level
        1: Enter a value greater than 0 to show only submenu items.
    showLevel:
        0: Stop level
        1: Enter a value greater than 0 to limit the nesting level of the menu.
    hardLimit:
        0: Hard limit
        1: Never show any menu items beyond the stop level.
    showProtected:
        0: Show protected items
        1: Show items that are usually only visible to authenticated members.
    defineRoot:
        0: Set a reference page
        1: Define a custom source or target page for the module.
    rootPage:
        0: Reference page
        1: Please choose the reference page.
    navigationTpl:
        0: Navigation template
        1: Here you can select the navigation template.
    customTpl:
        0: Module template
        1: Here you can select the module template.
    pages:
        0: Pages
        1: Please choose one or more pages.
    showHidden:
        0: Show hidden items
        1: Show items that are usually hidden in the navigation menu.
    customLabel:
        0: Custom label
        1: Here you can enter a custom label for the drop-down menu or the overview link.
    autologin:
        0: Allow auto login
        1: Allow members to log into the front end automatically.
    jumpTo:
        0: Redirect page
        1: Please choose the page to which visitors will be redirected when clicking a link or submitting a form.
    pwResetPage:
        0: Reset password page
        1: Here you can choose a page to which visitors will be redirected when clicking the <em>Forgot your password?</em> link.
    overviewPage:
        0: Overview page
        1: Select an overview page to include a link to it in the template.
    redirectBack:
        0: Redirect to last page visited
        1: Redirect the member back to the last page visited instead of the redirect page.
    1cl:
        0: One column
        1: Show the label above the input field.
    2cl:
        0: Two columns
        1: Show the label on the left side of the input field.
    editable:
        0: Editable fields
        1: Show these fields in the front end form.
    reqFullAuth:
        0: Require full authentication
        1: Users with only a "remember me" cookie must verify their identity in order to access the module.
    memberTpl:
        0: Form template
        1: Here you can select the form template.
    form:
        0: Form
        1: Please select a form.
    queryType:
        0: Default query type
        1: Please select the default query type.
    and:
        0: Find all words
        1: Returns only pages that contain all keywords.
    or:
        0: Find any word
        1: Returns all pages that contain any of the keywords.
    fuzzy:
        0: Fuzzy search
        1: Will find "Contao" if you search for "con" (equal to a wildcard search).
    simple:
        0: Simple form
        1: Contains a single input field only.
    advanced:
        0: Advanced form
        1: Contains an input field and a radio button menu to choose the query type.
    contextLength:
        0: Context length
        1: The first field defines the number of characters on the left and right side of each keyword and the second one the overall context length per result.
    minKeywordLength:
        0: Minimum keyword length
        1: Keywords deceeding the minimum length will be ignored in the search results. Set to 0 to disable.
    perPage:
        0: Items per page
        1: The number of items per page. Set to 0 to disable pagination.
    searchType:
        0: Search form layout
        1: Here you can select the search form layout.
    searchTpl:
        0: Search results template
        1: Here you can select the search results template.
    inColumn:
        0: Layout section
        1: Please choose the layout section whose articles you want to list.
    skipFirst:
        0: Skip items
        1: Here you can define how many items will be skipped.
    loadFirst:
        0: Load the first item
        1: Automatically redirect to the first item if none is selected.
    singleSRC:
        0: Source file
        1: Please select a file from the files directory.
    fullsize:
        0: Full-size view/new window
        1: Open the full-size image in a lightbox or the link in a new browser window.
    useCaption:
        0: Show caption
        1: Display the image name or caption below the image.
    multiSRC:
        0: Source files
        1: Please select one or more files from the files directory.
    html:
        0: HTML code
        1: You can modify the list of allowed HTML tags in the back end settings.
    unfilteredHtml:
        0: HTML code
        1: Take care when pasting things you don't understand. This could allow attackers to steal your identity or take control of the whole system.
    rss_cache:
        0: Cache timeout
        1: Here you can define how long the feed is being cached.
    rss_feed:
        0: Feed URLs
        1: Please enter the URL of one or more feeds.
    rss_template:
        0: Feed template
        1: Here you can select the feed template.
    protected:
        0: Protect module
        1: Show the module to certain member groups only.
    groups:
        0: Allowed member groups
        1: These groups will be able to see the module.
    cssID:
        0: CSS ID/class
        1: Here you can set an ID and one or more classes.
    disableCaptcha:
        0: Disable spam protection
        1: Here you can disable the spam protection (not recommended).
    reg_groups:
        0: Member groups
        1: Here you can assign the member to one or more groups.
    reg_allowLogin:
        0: Allow login
        1: Allow the new member to log into the front end.
    reg_skipName:
        0: Skip username
        1: Do not require the username to request a new password.
    reg_close:
        0: Mode
        1: Here you can define how to handle the deletion.
    reg_deleteDir:
        0: Delete home directory
        1: Delete the home directory when the account is deleted.
    reg_assignDir:
        0: Create a home directory
        1: Create a home directory from the registered username.
    reg_homeDir:
        0: Home directory path
        1: Please select the parent folder from the files directory.
    reg_activate:
        0: Send activation e-mail
        1: Send an activation e-mail to the registered e-mail address.
    reg_jumpTo:
        0: Confirmation page
        1: Please choose the page to which members will be redirected after the request has been completed.
    reg_text:
        0: Activation message
        1: You can use the wildcards <em>##domain##</em> (domain name), <em>##link##</em> (activation link) and any input field (e.g. <em>##lastname##</em>).
    reg_password:
        0: Password message
        1: You can use the wildcards <em>##domain##</em> (domain name), <em>##link##</em> (activation link) and any member property (e.g. <em>##lastname##</em>).
    data:
        0: Template data
        1: These values are available as <code>$this->data</code> in the template.
    rootPageDependentModules:
        0: Modules
        1: Please select a module for every website root page.
    rootPageDependentModulesBlankOptionLabel: Choose module for "%s" [%s]
    title_legend: Title and type
    label_legend: Label
    nav_legend: Navigation settings
    reference_legend: Reference page
    redirect_legend: Redirect settings
    template_legend: Template settings
    image_legend: Image settings
    config_legend: Module configuration
    include_legend: Include settings
    source_legend: Source
    html_legend: Text/HTML
    protected_legend: Access protection
    expert_legend: Expert settings
    email_legend: E-mail settings
    account_legend: Account settings
    emailText:
        0: Your registration on %s
        1: |
            Thank you for your registration on ##domain##.

            Click here to complete your registration and to activate your account:

            ##link##

            The confirmation link is valid for 24 hours.

            If you did not request an account, please ignore this e-mail.
    passwordText:
        0: Your password request on %s
        1: |
            You have requested a new password for ##domain##.

            Click here to set the new password:

            ##link##

            If you did not request this e-mail, please contact the website administrator.
    internal: Internal file
    external: External URL
    close_deactivate: Deactivate account
    close_delete: Irrevocably delete account
    new:
        1: Create a new module
    show:
        1: Show the details of module ID %s
    versions:
        1: Show the versions of module ID %s
    edit:
        1: Edit module ID %s
    copy:
        1: Copy module ID %s
    cut:
        1: Move module ID %s
    delete:
        1: Delete module ID %s
    tableLabel: Module
