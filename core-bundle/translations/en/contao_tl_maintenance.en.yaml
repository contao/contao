tl_maintenance_jobs:
    index:
        0: Purge the search index
        1: Truncates the tables <code>tl_search</code>, <code>tl_search_index</code> and <code>tl_search_term</code>. Afterwards, you have to rebuild the search index (see above).
    undo:
        0: Purge the undo table
        1: Truncates the <code>tl_undo</code> table which stores the deleted records. This job permanently deletes these records.
    versions:
        0: Purge the version table
        1: Truncates the <code>tl_version</code> table which stores the previous versions of a record. This job permanently deletes these records.
    log:
        0: Purge the system log
        1: Truncates the <code>tl_log</code> table which stores all the system log entries. This job permanently deletes these records.
    crawl_queue:
        0: Purge the crawl queue
        1: Truncates the <code>tl_crawl_queue</code> table which stores all the queue information from crawl processes.
    images:
        0: Purge the image cache
        1: Removes the automatically generated images and then purges the shared cache, so there are no links to deleted resources.
    previews:
        0: Purge the preview cache
        1: Removes the automatically generated preview images and then purges the shared cache, so there are no links to deleted resources.
    scripts:
        0: Purge the script cache
        1: Removes the automatically generated <code>.css</code> and <code>.js</code> files and then purges the shared cache, so there are no links to deleted resources.
    pages:
        0: Purge the shared cache
        1: Removes the cached versions of the front end pages.
    temp:
        0: Purge the temp folder
        1: Removes the temporary files.
    xml:
        0: Recreate the XML files
        1: Recreates the XML files in the <code>share</code> folder and then purges the shared cache, so there are no links to deleted resources.
    symlinks:
        0: Recreate the symlinks
        1: Recreates the symlinks in the public folder (document root).
