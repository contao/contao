tl_article:
    title:
        0: Title
        1: Please enter the article title.
    alias:
        0: Article alias
        1: The article alias is a unique reference to the article which can be called instead of its numeric ID.
    author:
        0: Author
        1: Here you can change the author of the article.
    inColumn:
        0: Display in
        1: Please choose the layout section you want the article to be displayed in.
    teaserCssID:
        0: Teaser CSS ID/class
        1: Here you can set an ID and one or more classes for the teaser element.
    showTeaser:
        0: Show teaser
        1: Show the article teaser if there are multiple articles.
    teaser:
        0: Article teaser
        1: The article teaser can also be displayed with the content element "article teaser".
    printable:
        0: Syndication
        1: Here you can choose which options are available.
    customTpl:
        0: Article template
        1: Here you can select the article template.
    protected:
        0: Protect article
        1: Show the article to certain member groups only.
    groups:
        0: Allowed member groups
        1: These groups will be able to see the article.
    cssID:
        0: CSS ID/class
        1: Here you can set an ID and one or more classes.
    published:
        0: Publish article
        1: Make the article publicly visible on the website.
    start:
        0: Show from
        1: If you want to prevent the article from showing on the website before a certain date/time, you can enter it here. Otherwise, leave the field blank.
    stop:
        0: Show until
        1: If you want to prevent the article from showing on the website after a certain date/time, you can enter it here. Otherwise, leave the field blank.
    tstamp:
        0: Revision date
        1: Date and time of the latest revision
    title_legend: Title and author
