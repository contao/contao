tl_module:
    name:
        - Internal title
        - Please enter the module title.
    headline:
        - Headline
        - Here you can add a headline to the module.
    type:
        - Module type
        - Please choose the type of module.
    ariaLabel:
        - ARIA label
        - If there is more than one navigation element on the page, each should have a unique label.
    levelOffset:
        - Start level
        - Enter a value greater than 0 to show only submenu items.
    showLevel:
        - Stop level
        - Enter a value greater than 0 to limit the nesting level of the menu.
    hardLimit:
        - Hard limit
        - Never show any menu items beyond the stop level.
    showProtected:
        - Show protected items
        - Show items that are usually only visible to authenticated members.
    defineRoot:
        - Set a reference page
        - Define a custom source or target page for the module.
    rootPage:
        - Reference page
        - Please choose the reference page.
    navigationTpl:
        - Navigation template
        - Here you can select the navigation template.
    customTpl:
        - Module template
        - Here you can select the module template.
    pages:
        - Pages
        - Please choose one or more pages.
    showHidden:
        - Show hidden items
        - Show items that are usually hidden in the navigation menu.
    customLabel:
        - Custom label
        - Here you can enter a custom label for the drop-down menu or the overview link.
    autologin:
        - Allow auto login
        - Allow members to log into the front end automatically.
    jumpTo:
        - Redirect page
        - Please choose the page to which visitors will be redirected when clicking a link or submitting a form.
    pwResetPage:
        - Reset password page
        - Here you can choose a page to which visitors will be redirected when clicking the <em>Forgot your password?</em> link.
    overviewPage:
        - Overview page
        - Select an overview page to include a link to it in the template.
    redirectBack:
        - Redirect to last page visited
        - Redirect the member back to the last page visited instead of the redirect page.
    1cl:
        - One column
        - Show the label above the input field.
    2cl:
        - Two columns
        - Show the label on the left side of the input field.
    editable:
        - Editable fields
        - Show these fields in the front end form.
    reqFullAuth:
        - Require full authentication
        - Users with only a "remember me" cookie must verify their identity in order to access the module.
    memberTpl:
        - Form template
        - Here you can select the form template.
    form:
        - Form
        - Please select a form.
    queryType:
        - Default query type
        - Please select the default query type.
    and:
        - Find all words
        - Returns only pages that contain all keywords.
    or:
        - Find any word
        - Returns all pages that contain any of the keywords.
    fuzzy:
        - Fuzzy search
        - Will find "Contao" if you search for "con" (equal to a wildcard search).
    simple:
        - Simple form
        - Contains a single input field only.
    advanced:
        - Advanced form
        - Contains an input field and a radio button menu to choose the query type.
    contextLength:
        - Context length
        - The first field defines the number of characters on the left and right side of each keyword and the second one the overall context length per result.
    minKeywordLength:
        - Minimum keyword length
        - Keywords deceeding the minimum length will be ignored in the search results. Set to 0 to disable.
    perPage:
        - Items per page
        - The number of items per page. Set to 0 to disable pagination.
    searchType:
        - Search form layout
        - Here you can select the search form layout.
    searchTpl:
        - Search results template
        - Here you can select the search results template.
    inColumn:
        - Layout section
        - Please choose the layout section whose articles you want to list.
    skipFirst:
        - Skip items
        - Here you can define how many items will be skipped.
    loadFirst:
        - Load the first item
        - Automatically redirect to the first item if none is selected.
    singleSRC:
        - Source file
        - Please select a file from the files directory.
    fullsize:
        - Full-size view/new window
        - Open the full-size image in a lightbox or the link in a new browser window.
    useCaption:
        - Show caption
        - Display the image name or caption below the image.
    multiSRC:
        - Source files
        - Please select one or more files from the files directory.
    html:
        - HTML code
        - You can modify the list of allowed HTML tags in the back end settings.
    unfilteredHtml:
        - HTML code
        - Take care when pasting things you don't understand. This could allow attackers to steal your identity or take control of the whole system.
    rss_cache:
        - Cache timeout
        - Here you can define how long the feed is being cached.
    rss_feed:
        - Feed URLs
        - Please enter the URL of one or more feeds.
    rss_template:
        - Feed template
        - Here you can select the feed template.
    protected:
        - Protect module
        - Show the module to certain member groups only.
    groups:
        - Allowed member groups
        - These groups will be able to see the module.
    cssID:
        - CSS ID/class
        - Here you can set an ID and one or more classes.
    disableCaptcha:
        - Disable spam protection
        - Here you can disable the spam protection (not recommended).
    reg_groups:
        - Member groups
        - Here you can assign the member to one or more groups.
    reg_allowLogin:
        - Allow login
        - Allow the new member to log into the front end.
    reg_skipName:
        - Skip username
        - Do not require the username to request a new password.
    reg_close:
        - Mode
        - Here you can define how to handle the deletion.
    reg_deleteDir:
        - Delete home directory
        - Delete the home directory when the account is deleted.
    reg_assignDir:
        - Create a home directory
        - Create a home directory from the registered username.
    reg_homeDir:
        - Home directory path
        - Please select the parent folder from the files directory.
    reg_activate:
        - Send activation e-mail
        - Send an activation e-mail to the registered e-mail address.
    reg_jumpTo:
        - Confirmation page
        - Please choose the page to which members will be redirected after the request has been completed.
    reg_text:
        - Activation message
        - You can use the wildcards <em>##domain##</em> (domain name), <em>##link##</em> (activation link) and any input field (e.g. <em>##lastname##</em>).
    reg_password:
        - Password message
        - You can use the wildcards <em>##domain##</em> (domain name), <em>##link##</em> (activation link) and any member property (e.g. <em>##lastname##</em>).
    data:
        - Template data
        - These values are available as <code>$this->data</code> in the template.
    rootPageDependentModules:
        - Modules
        - Please select a module for every website root page.
    rootPageDependentModulesBlankOptionLabel: Choose module for "%s" [%s]
    title_legend: Title and type
    label_legend: Label
    nav_legend: Navigation settings
    reference_legend: Reference page
    redirect_legend: Redirect settings
    template_legend: Template settings
    image_legend: Image settings
    config_legend: Module configuration
    include_legend: Include settings
    source_legend: Source
    html_legend: Text/HTML
    protected_legend: Access protection
    expert_legend: Expert settings
    email_legend: E-mail settings
    account_legend: Account settings
    emailText:
        - Your registration on %s
        - |
            Thank you for your registration on ##domain##.

            Click here to complete your registration and to activate your account:

            ##link##

            The confirmation link is valid for 24 hours.

            If you did not request an account, please ignore this e-mail.
    passwordText:
        - Your password request on %s
        - |
            You have requested a new password for ##domain##.

            Click here to set the new password:

            ##link##

            If you did not request this e-mail, please contact the website administrator.
    internal: Internal file
    external: External URL
    close_deactivate: Deactivate account
    close_delete: Irrevocably delete account
    new:
        1: Create a new module
    show:
        1: Show the details of module ID %s
    versions:
        1: Show the versions of module ID %s
    edit:
        1: Edit module ID %s
    copy:
        1: Copy module ID %s
    cut:
        1: Move module ID %s
    delete:
        1: Delete module ID %s
    tableLabel: Module
