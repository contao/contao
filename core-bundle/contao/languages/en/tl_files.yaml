tl_files:
    preview:
        - Image preview
        - Mark the important part of the image with your mouse cursor.
    name:
        - Name
        - The file or folder name (without extension).
    path:
        - Path
        - The relative path to the file or folder.
    extension:
        - Extension
        - The file extension
    protected:
        - Public
        - Make the folder and its sub-folders accessible via HTTP.
