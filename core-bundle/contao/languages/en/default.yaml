        0: External redirect
        1: This type of page automatically redirects visitors to an external website. It works like a hyperlink.
    forward:
        0: Internal redirect
        1: This type of page automatically forwards visitors to another page.
    root:
        0: Website root
        1: This type of page marks the starting point of a new website.
    logout:
        0: Logout
        1: This type of page automatically logs out the user.
    error_401:
        0: 401 Not authenticated
        1: If a visitor requests a protected page without being authenticated, a 401 error page will be loaded instead.
    error_403:
        0: 403 Access denied
        1: If a member requests a protected page without permission, a 403 error page will be loaded instead.
    error_404:
        0: 404 Page not found
        1: If a visitor requests a non-existent page, a 404 error page will be loaded instead.
    error_503:
        0: 503 Service unavailable
        1: When a website root page is in maintenance mode, all requests will show a 503 error page.
