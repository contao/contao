tl_form_field:
    type:
        0: Field type
        1: Please choose the type of field.
    name:
        0: Field name
        1: The field name is a unique name to identify the field.
    label:
        0: Field label
        1: The field label will be visible on the website, typically in front of or above the field.
    text:
        0: Text
        1: You can use HTML tags to format the text.
    html:
        0: HTML
        1: You can modify the list of allowed HTML tags in the back end settings.
    options:
        0: Options
        1: If JavaScript is disabled, make sure to save your changes before modifying the order.
    mandatory:
        0: Mandatory field
        1: The form will not submit if the field is empty.
    rgxp:
        0: Input validation
        1: Validate the input against a regular expression.
    digit:
        0: Numeric characters
        1: Allows numeric characters, minus (-) and full stop (.).
    alpha:
        0: Alphabetic characters
        1: Allows alphabetic characters, minus (-), full stop (.) and space ( ).
    alnum:
        0: Alphanumeric characters
        1: Allows alphabetic and numeric characters, minus (-), full stop (.), underscore (_) and space ( ).
    extnd:
        0: Extended alphanumeric characters
        1: 'Allows everything except special characters which are usually encoded for security reasons: #<>()\='
    date:
        0: Date
        1: Checks whether the input matches the global date format.
    time:
        0: Time
        1: Checks whether the input matches the global time format.
    datim:
        0: Date and time
        1: Checks whether the input matches the global date and time format.
    phone:
        0: Phone number
        1: Allows numeric characters, plus (+), minus (-), slash (/), parentheses () and space ( ).
    email:
        0: E-mail address
        1: Checks whether the input is a valid e-mail address.
    url:
        0: URL format
        1: Checks whether the input is a valid URL.
    httpurl:
        0: Absolute URL
        1: Checks whether the input is a valid absolute URL.
    custom:
        0: Custom
        1: Checks against a custom regular expression.
    placeholder:
        0: Placeholder
        1: Show this text as long as the field is empty (requires HTML5).
    help:
        0: Help text
        1: Here you can enter a help text that is associated with the field.
    customRgxp:
        0: Custom regular expression
        1: The custom regular expression including delimiters and modifiers.
    errorMsg:
        0: Error message
        1: Show this error message in the front end if the user input is invalid.
    minlength:
        0: Minimum length
        1: Require the field value to be a certain number of characters long.
    maxlength:
        0: Maximum length
        1: Limit the field length to a certain number of characters (text) or bytes (file uploads).
    maxImageWidth:
        0: Maximum image width
        1: Here you can enter the maximum width for image uploads in pixels. Enter 0 to use the system default.
    maxImageHeight:
        0: Maximum image height
        1: Here you can enter the maximum height for image uploads in pixels. Enter 0 to use the system default.
    minval:
        0: Minimum value
        1: Here you can set the minimum value for numeric fields.
    maxval:
        0: Maximum value
        1: Here you can set the maximum value for numeric fields.
    step:
        0: Step
        1: Here you can set the discrete step size of the field.
    size:
        0: Rows and columns
        1: The number of rows and columns of the textarea.
    multiple:
        0: Multiple selection
        1: Allow visitors to select more than one option.
    mSize:
        0: List size
        1: Here you can enter the size of the select box.
    extensions:
        0: Allowed file types
        1: A comma separated list of valid file extensions.
    storeFile:
        0: Store uploaded files
        1: Move the uploaded files to a folder on the server.
    uploadFolder:
        0: Target folder
        1: Please select the target folder from the files directory.
    useHomeDir:
        0: Use home directory
        1: Store the file in the home directory if there is an authenticated member.
    doNotOverwrite:
        0: Preserve existing files
        1: Add a numeric suffix to the new file if the file name already exists.
    multipleFiles:
        0: Allow multiple files
        1: Allow the user to upload multiple files.
    value:
        0: Default value
        1: Here you can enter a default value for the field.
    class:
        0: CSS class
        1: Here you can enter one or more classes.
    accesskey:
        0: Access key
        1: A form field can be focused by pressing the [ALT] or [CTRL] key and the access key simultaneously.
    fSize:
        0: Field size
        1: Here you can enter the size of the upload field (<em>size</em> attribute).
    customTpl:
        0: Form field template
        1: Here you can select the form field template.
    slabel:
        0: Submit button label
        1: Please enter the label of the submit button.
    imageSubmit:
        0: Create an image button
        1: Use an image submit button instead of the default one.
    singleSRC:
        0: Source file
        1: Please select an image from the files directory.
    altchaAuto:
        0: Auto verification
        1: Automatically verify without user interaction.
    altchaHideLogo:
        0: Hide logo
        1: Hide the ALTCHA logo.
    altchaHideFooter:
        0: Hide footer
        1: Hide the footer (ALTCHA link).
    altchaFloating:
        0: Floating mode
        1: Enable the floating UI.
    autocomplete:
        0: Autocomplete attributes
        1: Here you can enter autocomplete attributes so that the browser knows how to pre-populate the form field with user-preferred values.
    invisible:
        0: Invisible
        1: Hide the form field on the website.
    type_legend: Field type and name
    text_legend: Text/HTML
    fconfig_legend: Field configuration
    options_legend: Options
    store_legend: Store file
    expert_legend: Expert settings
    size_legend: Rows and columns
    rgxp_legend: Validation settings
    template_legend: Template settings
    submit_legend: Submit button
    image_legend: Image button
    invisible_legend: Visibility
    new:
        1: Create a new form field
    show:
        1: Show the details of form field ID %s
    versions:
        1: Show the versions of form field ID %s
    edit:
        1: Edit form field ID %s
    cut:
        1: Move form field ID %s
    copy:
        1: Copy form field ID %s
    delete:
        1: Delete form field ID %s
    toggle:
        0: Hide/unhide form field
        1: Hide form field ID %s
        2: Unhide form field ID %s
        3: Hide
        4: Unhide
    pasteafter:
        1: Paste after form field ID %s
    pastenewtop:
        1: Create a new form field at the top
    pastenewafter:
        1: Create a new form field after form field ID %s
    option:
        1: Import options from a CSV file
    tableLabel: Form field
