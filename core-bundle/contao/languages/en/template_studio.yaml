template_studio:
    getting-started:
        - Getting started
        - Select a template from the browser. You can then inspect all its representations and create your own versions and variants.
    theme-selector: Theme context
    no_theme_context: Default/None
    not_prefixed: without prefix
    search_filter: Search templates…
    user_filter: Show only my templates
    operation:
        save:
            - Save
            - Save your template for %s
        delete:
            - Delete
            - Delete your template for %s
        create:
            - Create your template
            - Modify %s by creating your own template
        create_content_element_variant:
            - Create variant
            - Create a new variant template for the %s content element
        rename_content_element_variant:
            - Rename variant
            - Rename the %s variant template
        create_frontend_module_variant:
            - Create variant
            - Create a new variant template for the %s front end module
        rename_frontend_module_variant:
            - Rename variant
            - Rename the %s variant template
        rename_legacy_variant:
            - Rename variant
            - Rename the %s variant template
        create_page_variant:
            - Create variant
            - Create a new variant template for the %s layout
        rename_page_variant:
            - Rename variant
            - Rename the %s variant template
        create_legacy_variant:
            - Create variant
            - Create a new variant template for the %s legacy template
    message:
        create:
            success: Your template for %s was created.
            error: Your template for %s could not be created.
        create_variant:
            success: The %s variant template was created.
            error: A variant template for %s could not be created.
        rename_variant:
            success: The variant template was renamed to %s.
            error: The variant template %s could not be renamed.
        save:
            success: Your template for %s was saved.
            error: Your template for %s could not be saved.
        delete:
            success: Your template for %s was deleted.
            error: Your template for %s could not be deleted.
        open_tab:
            error: The template %s cannot be found or opened in an editor tab.
        open_block_info:
            error: The block %s was not found yet. Did you save the template?
    dialog:
        delete:
            confirm: This deletes your template for %s and cannot be undone.
        create_variant: You are creating a new variant template for %s. Please define a unique name.
        rename_variant: Please define a new unique name for the variant template %s.
    editor_tab:
        relation:
            not_analyzable: The template's relation cannot be analyzed because it contains errors.
            no_extend_warning: This template overwrites all previously defined content because it does not extend %previous%.
            no_use_warning: This template ignores all previously defined content because it does not use %previous%.
    info:
        block:
            title: Hierarchy of block %block%
            hierarchy: Block %block% is originally defined in the %namespace% namespace and is modified %modify_count% time(s) when rendering the %target_template% template.
            flat_hierarchy: Block %block% is originally defined in the %target_template% template.
            overwrite_warning: This template defines content for the %block% block without using the %expression_to_use% expression. This overwrites previously defined content.
    snapshots:
        create: Create snapshot
        current: 'Current snapshot: %s %s'
        compare: Compare changes
        rollback: Rollback
        confirm: Restore the entire templates directory to the latest snapshot?
        no_changes: No changes since the latest snapshot.
        created: Snapshot %s created. Note, that snapshots are deleted when the cache is cleared.
        restored: The latest snapshot has been restored.
