tl_image_size:
    name:
        - Name
        - Please enter the image size name.
    width:
        - Width
        - Here you can enter the width in pixels.
    height:
        - Height
        - Here you can enter the height in pixels.
    resizeMode:
        - Resize mode
        - Only applicable if width and height are specified.
    zoom:
        - Zoom
        - 0 = the whole image is visible, 100 = only the important part of the image is visible.
    sizes:
        - Sizes attribute
        - 'Here you can define the intended layout width of the image, the actual size should be defined via CSS. Example: <em>auto, (max-width: 600px) 100vw, 50vw</em>.'
    densities:
        - Pixel densities/scale factors
        - Here you can define the pixel densities (e.g. <em>1x, 1.5x, 2x</em>) or width descriptors (e.g. <em>100w, 200w</em>).
    cssClass:
        - CSS classes
        - The CSS classes will be added to the image tag.
    formats:
        - Convert image formats
        - Here you can select which image formats shall be converted.
    formatsNotSupported: 'The following formats are not supported on your server: %s'
    preserveMetadata:
        - Preserve copyright metadata
        - Preserve copyright-related metadata fields (EXIF, IPTC, XMP).
    preserveMetadataFields:
        - Metadata fields
        - Please select the metadata fields to preserve.
    skipIfDimensionsMatch:
        - Use original image if dimensions match
        - Note that no optimizations such as metadata stripping or JPEG compression will be applied in this case.
    imageQuality:
        - Image quality
        - Here you can set the image compression quality between 0 (lowest quality) and 100 (highest quality). Leave blank to use the system default.
    lazyLoading:
        - Enable lazy loading
        - Defer loading the image until it is scrolled into the viewport.
    fetchPriority:
        - Fetch priority
        - Suggest how the browser should prioritize fetching the image. Use sparingly, as incorrect priorities can reduce page performance.
    decoding:
        - Decoding
        - Suggest how the browser should decode the image.
    tstamp:
        - Revision date
        - Date and time of the latest revision
    title_legend: Image size settings
    source_legend: Image source settings
    loading_legend: Loading options
    metadata_legend: Metadata settings
    expert_legend: Expert settings
    proportional:
        - Proportional
        - The longer side of the image is adjusted to the given dimensions and the image is resized proportionally.
    box:
        - Fit the box
        - The image will be resized proportionally so that neither side exceeds any of the given dimensions. This is similar to the <em>contain</em> value in CSS.
    crop:
        - Crop
        - The image will be resized to the exact dimensions given, cropping the image if necessary while preserving the important part if specified. This is similar to the <em>cover</em> value in CSS.
    preserveMetadataOptions:
        default: Use default settings
        overwrite: Select custom metadata fields
        delete: Remove all metadata fields
    new:
        1: Create a new image size
    show:
        1: Show the details of image size ID %s
    versions:
        1: Show the versions of image size ID %s
    edit:
        1: Edit image size ID %s
    children:
        - Media queries
        - Edit the media queries of image size ID %s
    cut:
        1: Move image size ID %s
    copy:
        1: Copy image size ID %s
    delete:
        1: Delete image size ID %s
    tableLabel: Image size
