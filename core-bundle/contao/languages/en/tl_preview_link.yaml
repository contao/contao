tl_preview_link:
    url:
        0: Target URL
        1: The front end URL to be shared.
    showUnpublished:
        0: Show unpublished
        1: Show unpublished pages and elements when sharing this link.
    previewTime:
        0: Preview time
        1: Show the preview at a specific date and time.
    restrictToUrl:
        0: Restrict access to specified URL
        1: Allow access only to the specified URL instead of the entire website.
    createdAt:
        0: Created at
        1: Date and time when the preview link was created.
    createdBy:
        0: Created by
        1: The user who created the preview link.
    expiresAt:
        0: Valid until
        1: Preview of the final date until which the link is available.
    published:
        0: Enable
        1: Activate the link for sharing.
    share:
        0: Copy to clipboard
        1: Copy the preview link ID %s to your clipboard
    url_legend: Target URL
    config_legend: Configuration
    publishing_legend: Publish settings
    expire_options:
        1: 1 day
        7: 7 days
        30: 30 days
    hintNew: To add a preview link, use the "Share URL" button in the front end preview toolbar.
    hintSave: Please save this record to generate the preview link.
    hintEdit: Preview link
    hintExpired: This preview link has expired and can no longer be shared.
    show:
        1: Show the details of preview link ID %s
    versions:
        1: Show the versions of preview link ID %s
    edit:
        1: Edit preview link ID %s
    delete:
        1: Delete preview link ID %s
    toggle:
        0: Enable/disable preview link
        1: Disable preview link ID %s
        2: Enable preview link ID %s
        3: Disable
        4: Enable
