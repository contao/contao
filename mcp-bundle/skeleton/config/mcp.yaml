mcp:
    servers:
        contao_backend:
            name: Contao Backend
            registry:
                tools:
                    - Contao\McpBundle\Tool\DataContainerTools
            transports:
                http: true
                stdio: false
            http:
                path: '%contao.backend.route_prefix%/_mcp'
            session:
                store: file
                directory: '%kernel.cache_dir%/mcp/contao_backend'
                ttl: 3600
