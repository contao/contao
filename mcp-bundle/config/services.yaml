services:
    _defaults:
        autoconfigure: true

    contao_mcp.api.binary_payload_handler:
        class: Contao\McpBundle\Api\BinaryPayloadHandler
        arguments:
            - '@contao.file.upload_size_provider'
            - '%contao.mcp.max_binary_payload_size%'

    contao_mcp.api.operation_registry:
        class: Contao\McpBundle\Api\ApiOperationRegistry
        arguments:
            - '@api_platform.metadata.resource.name_collection_factory'
            - '@api_platform.metadata.resource.metadata_collection_factory'
            - '@api_platform.openapi.factory'
            - '@serializer'

    contao_mcp.controller.serialized_mcp:
        class: Contao\McpBundle\Controller\SerializedMcpController
        decorates: mcp.server.contao_backend.controller
        arguments:
            - '@.inner'
            - '@lock.factory'

    contao_mcp.resource.template_guidance:
        class: Contao\McpBundle\Resource\TemplateGuidance

    contao_mcp.response.api_converter:
        class: Contao\McpBundle\Response\ApiResponseConverter

    contao_mcp.routing.mcp_request_matcher:
        class: Contao\McpBundle\Routing\McpRequestMatcher

    contao_mcp.tool.api_tools:
        class: Contao\McpBundle\Tool\ApiTools
        autoconfigure: true
        arguments:
            - '@contao_mcp.api.operation_registry'
            - '@http_kernel'
            - '@contao_api.http.api_request_factory'
            - '@request_stack'
            - '@contao_mcp.response.api_converter'
            - '@contao_mcp.api.binary_payload_handler'

    contao_mcp.tool.user_template_tools:
        class: Contao\McpBundle\Tool\UserTemplateTools
        autoconfigure: true
        arguments:
            - '@api_platform.metadata.resource.metadata_collection_factory'
            - '@http_kernel'
            - '@contao_api.http.api_request_factory'
            - '@request_stack'
            - '@contao_mcp.response.api_converter'
            - '@contao_mcp.user_template.validator'
            - '@contao_mcp.user_template.impact_analyzer'
            - '@security.helper'

    contao_mcp.user_template.impact_analyzer:
        class: Contao\McpBundle\UserTemplate\UserTemplateImpactAnalyzer
        arguments:
            - '@contao.twig.filesystem_loader'
            - '@contao.twig.inspector'

    contao_mcp.user_template.validator:
        class: Contao\McpBundle\UserTemplate\UserTemplateValidator
        arguments:
            - '@twig'
            - '@contao.twig.filesystem_loader'
