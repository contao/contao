services:
    _defaults:
        autoconfigure: true

    contao.mcp_bundle.controller.serialized_mcp_controller:
        class: Contao\McpBundle\Controller\SerializedMcpController
        decorates: mcp.server.contao_backend.controller
        arguments:
            - '@.inner'
            - '@lock.factory'

    Contao\McpBundle\Response\ApiResponseConverter: ~

    Contao\McpBundle\Resource\TemplateGuidance: ~

    Contao\McpBundle\Api\ApiOperationRegistry:
        arguments:
            - '@api_platform.metadata.resource.name_collection_factory'
            - '@api_platform.metadata.resource.metadata_collection_factory'
            - '@api_platform.openapi.factory'
            - '@serializer'

    Contao\McpBundle\Api\BinaryPayloadHandler:
        arguments:
            - '@Contao\CoreBundle\File\UploadSizeProvider'
            - '%contao.mcp.max_binary_payload_size%'

    Contao\McpBundle\Tool\ApiTools:
        autoconfigure: true
        arguments:
            - '@Contao\McpBundle\Api\ApiOperationRegistry'
            - '@http_kernel'
            - '@Contao\ApiBundle\Http\ApiRequestFactory'
            - '@request_stack'
            - '@Contao\McpBundle\Response\ApiResponseConverter'
            - '@Contao\McpBundle\Api\BinaryPayloadHandler'

    Contao\McpBundle\Tool\UserTemplateTools:
        autoconfigure: true
        arguments:
            - '@api_platform.metadata.resource.metadata_collection_factory'
            - '@http_kernel'
            - '@Contao\ApiBundle\Http\ApiRequestFactory'
            - '@request_stack'
            - '@Contao\McpBundle\Response\ApiResponseConverter'
            - '@Contao\McpBundle\UserTemplate\UserTemplateValidator'
            - '@Contao\McpBundle\UserTemplate\UserTemplateImpactAnalyzer'
            - '@security.helper'

    Contao\McpBundle\UserTemplate\UserTemplateValidator:
        arguments:
            - '@twig'
            - '@contao.twig.filesystem_loader'

    Contao\McpBundle\UserTemplate\UserTemplateImpactAnalyzer:
        arguments:
            - '@contao.twig.filesystem_loader'
            - '@contao.twig.inspector'

    contao.mcp_bundle.routing.mcp_request_matcher:
        class: Contao\McpBundle\Routing\McpRequestMatcher
