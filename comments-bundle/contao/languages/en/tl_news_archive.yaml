tl_news_archive:
    allowComments:
        - Enable comments
        - Allow visitors to comment news items.
    notify:
        - Notify
        - Please choose who to notify when comments are added.
    sortOrder:
        - Sort order
        - By default, comments are sorted ascending, starting with the oldest one.
    perPage:
        - Comments per page
        - Number of comments per page. Set to 0 to disable pagination.
    moderate:
        - Moderate comments
        - Approve comments before they are published on the website.
    requireLogin:
        - Require login to comment
        - Allow only authenticated members to create comments.
    disableCaptcha:
        - Disable spam protection
        - Use this option only if you have limited comments to authenticated users.
    comments_legend: Comments
    notify_admin: System administrator
    notify_author: Author of the news item
    notify_both: Author and system administrator
    comments: Show comments of news archive ID %s
