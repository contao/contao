tl_calendar:
    allowComments:
        0: Enable comments
        1: Allow visitors to comment events.
    notify:
        0: Notify
        1: Please choose who to notify when comments are added.
    sortOrder:
        0: Sort order
        1: By default, comments are sorted ascending, starting with the oldest one.
    perPage:
        0: Comments per page
        1: Number of comments per page. Set to 0 to disable pagination.
    moderate:
        0: Moderate comments
        1: Approve comments before they are published on the website.
    requireLogin:
        0: Require login to comment
        1: Allow only authenticated members to create comments.
    disableCaptcha:
        0: Disable spam protection
        1: Use this option only if you have limited comments to authenticated users.
    comments_legend: Comments
