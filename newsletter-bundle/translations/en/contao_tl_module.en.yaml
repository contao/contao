tl_module:
    newsletters:
        0: Subscribable newsletters
        1: Show these channels in the front end form.
    nl_channels:
        0: Channels
        1: Please select one or more channels.
    nl_text:
        0: Custom text
        1: Here you can e.g. enter a privacy note to make the newsletter subscription GDPR-compliant.
    nl_hideChannels:
        0: Hide channel menu
        1: Do not show the channel selection menu.
    nl_subscribe:
        0: Subscription message
        1: You can use the wildcards <em>##channels##</em> (channel names), <em>##domain##</em> (domain name) and <em>##link##</em> (activation link).
    nl_unsubscribe:
        0: Unsubscription message
        1: You can use the wildcards <em>##channels##</em> (channel names) and <em>##domain##</em> (domain name).
    nl_template:
        0: Newsletter template
        1: Here you can select a newsletter template.
    text_legend: Custom text
    text_subscribe:
        0: Your subscription on %s
        1: |
            You have subscribed to the following channels on ##domain##:

            ##channels##

            Please click here to activate your subscription:

            ##link##

            The confirmation link is valid for 24 hours. You can cancel your subscription at any time.

            If you did not subscribe yourself, please ignore this e-mail.
    text_unsubscribe:
        0: Your subscription on %s
        1: |
            You have unsubscribed from the following channels on ##domain##:

            ##channels##
