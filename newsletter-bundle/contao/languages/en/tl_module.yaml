tl_module:
    newsletters:
        - Subscribable newsletters
        - Show these channels in the front end form.
    nl_channels:
        - Channels
        - Please select one or more channels.
    nl_text:
        - Custom text
        - Here you can e.g. enter a privacy note to make the newsletter subscription GDPR-compliant.
    nl_hideChannels:
        - Hide channel menu
        - Do not show the channel selection menu.
    nl_subscribe:
        - Subscription message
        - You can use the wildcards <em>##channels##</em> (channel names), <em>##domain##</em> (domain name) and <em>##link##</em> (activation link).
    nl_unsubscribe:
        - Unsubscription message
        - You can use the wildcards <em>##channels##</em> (channel names) and <em>##domain##</em> (domain name).
    nl_template:
        - Newsletter template
        - Here you can select a newsletter template.
    text_legend: Custom text
    text_subscribe:
        - Your subscription on %s
        - |
            You have subscribed to the following channels on ##domain##:

            ##channels##

            Please click here to activate your subscription:

            ##link##

            The confirmation link is valid for 24 hours. You can cancel your subscription at any time.

            If you did not subscribe yourself, please ignore this e-mail.
    text_unsubscribe:
        - Your subscription on %s
        - |
            You have unsubscribed from the following channels on ##domain##:

            ##channels##
