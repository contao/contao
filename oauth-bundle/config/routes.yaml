contao_oauth_authorization_server:
    path: /.well-known/oauth-authorization-server
    controller: contao_oauth.controller.authorization_server_metadata
    methods: [GET]

contao_oauth_protected_resource:
    path: /.well-known/oauth-protected-resource
    controller: contao_oauth.controller.protected_resource_metadata
    methods: [GET]

contao_oauth_protected_resource_path:
    path: /.well-known/oauth-protected-resource/{path}
    controller: contao_oauth.controller.protected_resource_metadata
    methods: [GET]
    requirements:
        path: .+

contao_oauth_authorize:
    path: '%contao.backend.route_prefix%/oauth/authorize'
    controller: contao_oauth.controller.authorize
    methods: [GET, POST]
    defaults:
        _scope: backend

contao_oauth_token:
    path: /_contao/oauth/token
    controller: contao_oauth.controller.token
    methods: [POST]
