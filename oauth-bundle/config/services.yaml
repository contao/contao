services:
    _defaults:
        autoconfigure: true

    contao_oauth.authorization_server.access_token_repository:
        class: Contao\OAuthBundle\AuthorizationServer\Repository\AccessTokenRepository
        arguments:
            - '@contao_oauth.repository.oauth_token'
            - '@contao_oauth.resource_context'

    contao_oauth.authorization_server.auth_code_repository:
        class: Contao\OAuthBundle\AuthorizationServer\Repository\AuthCodeRepository
        arguments:
            - '@contao_oauth.repository.oauth_token'

    contao_oauth.authorization_server.client_repository:
        class: Contao\OAuthBundle\AuthorizationServer\Repository\ClientRepository
        arguments:
            - '@contao_oauth.cimd.client_id_metadata_resolver'
            - '@request_stack'
            - '@?logger'

    contao_oauth.authorization_server.factory:
        class: Contao\OAuthBundle\AuthorizationServer\AuthorizationServerFactory
        arguments:
            - '@contao_oauth.authorization_server.client_repository'
            - '@contao_oauth.authorization_server.access_token_repository'
            - '@contao_oauth.authorization_server.scope_repository'
            - '@contao_oauth.authorization_server.auth_code_repository'
            - '@contao_oauth.authorization_server.refresh_token_repository'
            - '@contao_oauth.key_provider'

    contao_oauth.authorization_server.refresh_token_repository:
        class: Contao\OAuthBundle\AuthorizationServer\Repository\RefreshTokenRepository
        arguments:
            - '@contao_oauth.repository.oauth_token'

    contao_oauth.authorization_server.scope_repository:
        class: Contao\OAuthBundle\AuthorizationServer\Repository\ScopeRepository
        arguments:
            - '@contao_oauth.resource_context'

    contao_oauth.cimd.client_id_metadata_resolver:
        class: Contao\OAuthBundle\Cimd\ClientIdMetadataResolver
        arguments:
            - '@http_client'
            - '@cache.app'
            - '%contao_oauth.cimd_trusted_domains%'

    contao_oauth.controller.authorization_server_metadata:
        class: Contao\OAuthBundle\Controller\AuthorizationServerMetadataController
        public: true
        arguments:
            - '@contao_oauth.resource_context'
            - '@router'

    contao_oauth.controller.authorize:
        class: Contao\OAuthBundle\Controller\AuthorizeController
        public: true
        arguments:
            - '@contao_oauth.authorization_server.factory'
            - '@contao_oauth.http.psr_message_converter'
            - '@contao_oauth.resource_context'
            - '@security.helper'
            - '@twig'
            - '@contao.csrf.token_manager'
            - '%contao.csrf_token_name%'

    contao_oauth.controller.protected_resource_metadata:
        class: Contao\OAuthBundle\Controller\ProtectedResourceMetadataController
        public: true
        arguments:
            - '@contao_oauth.resource_context'

    contao_oauth.controller.token:
        class: Contao\OAuthBundle\Controller\TokenController
        public: true
        arguments:
            - '@contao_oauth.authorization_server.factory'
            - '@contao_oauth.http.psr_message_converter'
            - '@contao_oauth.resource_context'

    contao_oauth.cron.purge_expired_oauth_tokens:
        class: Contao\OAuthBundle\Cron\PurgeExpiredOAuthTokensCron
        arguments:
            - '@contao_oauth.repository.oauth_token'

    contao_oauth.http.psr_message_converter:
        class: Contao\OAuthBundle\Http\PsrMessageConverter

    contao_oauth.key_provider:
        class: Contao\OAuthBundle\KeyProvider
        arguments:
            - '%kernel.secret%'

    contao_oauth.repository.oauth_token:
        class: Contao\OAuthBundle\Repository\OAuthTokenRepository
        arguments:
            - '@doctrine'

    contao_oauth.resource_context:
        class: Contao\OAuthBundle\ResourceContext
        arguments:
            - '@request_stack'
            - '@router'
            - '%contao_oauth.resource.route%'
            - '%contao_oauth.resource.scopes%'
            - '%contao_oauth.resource.name%'

    contao_oauth.security.access_token_validator:
        class: Contao\OAuthBundle\Security\AccessTokenValidator
        arguments:
            - '@contao_oauth.key_provider'
            - '@contao_oauth.resource_context'
            - '@contao_oauth.authorization_server.access_token_repository'

    contao_oauth.security.bearer_authenticator:
        class: Contao\OAuthBundle\Security\BearerAuthenticator
        arguments:
            - '@contao_oauth.security.access_token_validator'
            - '@contao_oauth.security.bearer_challenge'

    contao_oauth.security.bearer_challenge:
        class: Contao\OAuthBundle\Security\BearerChallenge
        arguments:
            - '@contao_oauth.resource_context'
