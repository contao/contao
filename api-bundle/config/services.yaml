services:
    _defaults:
        autoconfigure: true

    # Merge Contao resources into API Platform's discovered resource names so the
    # entrypoint, docs and metadata pipeline can see DataContainerRecord.
    Contao\ApiBundle\ApiPlatform\Metadata\DataContainerResourceNameCollectionFactory:
        decorates: api_platform.metadata.resource.name_collection_factory
        arguments:
            $decorated: '@.inner'

    Contao\ApiBundle\ApiPlatform\Metadata\UserTemplateResourceNameCollectionFactory:
        decorates: api_platform.metadata.resource.name_collection_factory
        arguments:
            $decorated: '@.inner'
            $templateStudioEnabled: '%contao.template_studio.enabled%'

    # Provide Contao-specific metadata for the hardcoded DataContainerRecord resource.
    Contao\ApiBundle\ApiPlatform\Metadata\DataContainerResourceMetadataCollectionFactory:
        decoration_priority: 750
        decorates: api_platform.metadata.resource.metadata_collection_factory
        arguments:
            $decorated: '@.inner'
            $framework: '@contao.framework'
            $resourceFinder: '@contao.resource_finder'

    Contao\ApiBundle\ApiPlatform\Metadata\UserTemplateResourceMetadataCollectionFactory:
        decoration_priority: 750
        decorates: api_platform.metadata.resource.metadata_collection_factory
        arguments:
            $decorated: '@.inner'
            $templateStudioOperations: !tagged_iterator contao.operation.template_studio_element
            $templateStudioEnabled: '%contao.template_studio.enabled%'

    # Generate OpenAPI schemas from the metadata produced for DataContainerRecord
    # and add them as shared components so they only exist once in the spec.
    Contao\ApiBundle\ApiPlatform\OpenApi\DataContainerOpenApiFactory:
        decorates: api_platform.openapi.factory
        arguments:
            $decorated: '@.inner'
            $resourceMetadataCollectionFactory: '@api_platform.metadata.resource.metadata_collection_factory'
            $schemaFactory: '@Contao\ApiBundle\Schema\DataContainerSchemaFactory'
            $pagination: '@api_platform.pagination'
            $apiPrefix: '%contao.backend.route_prefix%/api'

    Contao\ApiBundle\Http\ApiRequestFactory:
        arguments:
            $urlGenerator: '@router'

    Contao\ApiBundle\Resource\DataContainerResourceRegistry:
        arguments:
            $metadataFactory: '@api_platform.metadata.resource.metadata_collection_factory'
            $schemaFactory: '@Contao\ApiBundle\Schema\DataContainerSchemaFactory'

    Contao\ApiBundle\Widget\WidgetConverterRegistry:
        arguments:
            $converters: !tagged_iterator contao.api.widget_converter

    Contao\ApiBundle\Schema\DataContainerSchemaFactory:
        arguments:
            $framework: '@contao.framework'
            $converters: '@Contao\ApiBundle\Widget\WidgetConverterRegistry'

    # Serialize DataContainerRecord payloads and handle reads/writes through
    # API Platform's serializer and state layers. The metadata factory points
    # every Contao DCA-backed resource at these shared services.
    Contao\ApiBundle\ApiPlatform\Serializer\DataContainerRecordNormalizer:
        tags:
            - { name: serializer.normalizer }

    Contao\ApiBundle\ApiPlatform\State\DataContainerStateProvider:
        arguments:
            $records: '@Contao\ApiBundle\DataContainer\TableDataContainerRecords'
            $pagination: '@api_platform.pagination'

    Contao\ApiBundle\ApiPlatform\State\DataContainerStateProcessor:
        arguments:
            $records: '@Contao\ApiBundle\DataContainer\TableDataContainerRecords'

    Contao\ApiBundle\DataContainer\DataContainerRecordMapper:
        arguments:
            $schemaFactory: '@Contao\ApiBundle\Schema\DataContainerSchemaFactory'
            $converters: '@Contao\ApiBundle\Widget\WidgetConverterRegistry'

    Contao\ApiBundle\Validator\Constraints\DataContainerRecordSchemaValidator:
        arguments:
            $schemaFactory: '@Contao\ApiBundle\Schema\DataContainerSchemaFactory'
            $validator: '@Opis\JsonSchema\Validator'
        tags:
            - { name: validator.constraint_validator }

    Contao\ApiBundle\DataContainer\TableDataContainerRecords:
        arguments:
            $mapper: '@Contao\ApiBundle\DataContainer\DataContainerRecordMapper'
            $connection: '@database_connection'
            $framework: '@contao.framework'
            $requestStack: '@request_stack'
            $requestSwitcher: '@contao.data_container.dca_request_switcher'
            $urlAnalyzer: '@contao.data_container.dca_url_analyzer'
            $urlGenerator: '@router'

    Opis\JsonSchema\Validator: ~

    Contao\ApiBundle\ApiPlatform\State\UserTemplateStateProvider:
        tags: [api_platform.state_provider]
        arguments:
            $client: '@Contao\ApiBundle\UserTemplate\TemplateStudioClient'

    Contao\ApiBundle\ApiPlatform\State\UserTemplateStateProcessor:
        tags: [api_platform.state_processor]
        arguments:
            $client: '@Contao\ApiBundle\UserTemplate\TemplateStudioClient'

    Contao\ApiBundle\UserTemplate\TemplateStudioClient:
        arguments:
            $kernel: '@http_kernel'
            $router: '@router'
            $requestStack: '@request_stack'
