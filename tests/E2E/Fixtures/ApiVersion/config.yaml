api_platform:
    mapping:
        paths:
            - '%kernel.project_dir%/src/Api'

services:
    _defaults:
        autoconfigure: true

    App\Api\VersionedExampleProvider: ~

    App\Api\VersionedExampleNormalizer:
        tags:
            - { name: serializer.normalizer, priority: 100 }

    App\Api\VersionedExampleOpenApiFactory:
        decorates: api_platform.openapi.factory
        arguments:
            $decorated: '@.inner'
