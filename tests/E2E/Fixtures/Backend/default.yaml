        published: 1

tl_theme:
    theme_editorial:
        tstamp: 1704067200
        name: Editorial
        author: Contao

tl_layout:
    layout_editorial:
        pid: '@theme_editorial'
        tstamp: 1704067200
        name: Editorial
        modules:
            - mod: 0
              col: main
              enable: 1

tl_user_group:
    group_page_mount_structure:
        name: Page mount | Manage structure
    group_fields_page_mount:
        name: Fields | Page mount editor
        alexf:
            - tl_page::title
            - tl_article::title
    group_pages_main_content:
        tstamp: 1704067200
        name: Pages | Main website | Edit content
        modules:
            - page
            - article
        alpty:
            - regular
        disable: 0
    group_pages_microsite_structure:
        tstamp: 1704067200
        name: Pages | Microsite | Manage structure
        modules:
            - page
            - article
        alpty:
            - regular
            - forward
            - redirect
        disable: 0
    group_content_elements_basic:
        tstamp: 1704067200
        name: Content elements | Basic
        elements:
            - headline
            - text
            - image
            - hyperlink
            - list
        disable: 0

tl_user:
    user_page_mount_manager:
        username: page-mount-manager
        name: Page mount manager
        email: page-mount-manager@example.com
        language: en
        password: backend
        groups:
            - '@group_pages_main_content'
            - '@group_fields_page_mount'
            - '@group_page_mount_structure'
            - '@group_pages_microsite_structure'
        inherit: extend
        pagemounts:
            - '1001'
        disable: 0
    user_page_mount_editor:
        username: page-mount-editor
        name: Page mount editor
        email: page-mount-editor@example.com
        language: en
        password: backend
        groups:
            - '@group_pages_main_content'
            - '@group_fields_page_mount'
        inherit: extend
        pagemounts:
            - '1001'
        disable: 0
    user_content_editor:
        tstamp: 1704067200
        username: content-editor
        name: Content editor
        email: content-editor@example.com
        language: en
        password: backend
        groups:
            - '@group_pages_main_content'
            - '@group_content_elements_basic'
        inherit: extend
        pagemounts:
            - '@page_main_website'
        disable: 0
        dateAdded: 1704067200
