        pid: '@page_string_mount_home'
        sorting: 128
        title: Page mount article
        alias: page-mount-article
        inColumn: main
        published: 1
    article_main_home:
        pid: '@page_main_home'
        sorting: 128
        tstamp: 1704067200
        title: Main website home
        alias: main-website-home
