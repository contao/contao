tl_calendar_events:
    title:
        0: Title
        1: Please enter the event title.
    alias:
        0: Event alias
        1: The event alias is a unique reference to the event which can be called instead of its numeric ID.
    author:
        0: Author
        1: Here you can change the author of the event.
    addTime:
        0: Add time
        1: Add a start and end time to the event.
    startTime:
        0: Start time
        1: Please enter the start time according to the global time format.
    endTime:
        0: End time
        1: Leave blank to create an open-ended event.
    startDate:
        0: Start date
        1: Please enter the start date according to the global date format.
    endDate:
        0: End date
        1: Leave blank to create a single day event.
    pageTitle:
        0: Meta title
        1: Here you can add a custom meta title to overwrite the default page title.
    robots:
        0: Robots tag
        1: Here you can overwrite how search engines handle the event.
    description:
        0: Meta description
        1: Here you can add a custom meta description to overwrite the default page description.
    canonicalLink:
        0: Canonical URL
        1: Here you can set a custom canonical URL like https://example.com/.
    location:
        0: Location name
        1: Here you can enter the name of the event location.
    address:
        0: Location address
        1: Here you can enter the address of the event location.
    teaser:
        0: Event teaser
        1: The event teaser can be shown in an event list instead of the full article. A "read more …" link will be added automatically.
    details:
        0: Event text
        1: Here you can enter the event text.
    addImage:
        0: Add an image
        1: Add an image to the event.
    recurring:
        0: Repeat event
        1: Create a recurring event.
    repeatEach:
        0: Interval
        1: Here you can set the recurrence interval.
    recurrences:
        0: Recurrences
        1: Set to 0 for unlimited recurrences.
    repeatEnd: End of recurring event
    addEnclosure:
        0: Add enclosures
        1: Add one or more downloadable files to the event.
    enclosure:
        0: Enclosures
        1: Please choose the files you want to attach.
    source:
        0: Redirect target
        1: Here you can override the default redirect target.
    default:
        0: Use default
        1: By clicking the "read more …" button, visitors will be redirected to the default page of the calendar.
    internal:
        0: Page
        1: By clicking the "read more …" button, visitors will be redirected to an internal page.
    article:
        0: Article
        1: By clicking the "read more …" button, visitors will be redirected to an article.
    external:
        0: Custom URL
        1: By clicking the "read more …" button, visitors will be redirected to custom URL.
    linkText:
        0: Link text
        1: Here you can override the default "read more…" link text.
    jumpTo:
        0: Redirect page
        1: Please choose the page to which visitors will be redirected when clicking the event.
    articleId:
        0: Article
        1: Please choose the article to which visitors will be redirected when clicking the event.
    cssClass:
        0: CSS class
        1: Here you can enter one or more classes.
    featured:
        0: Feature event
        1: Show the event in a featured event list.
    published:
        0: Publish event
        1: Make the event publicly visible on the website.
    start:
        0: Show from
        1: If you want to prevent the event from showing on the website before a certain date/time, you can enter it here. Otherwise, leave the field blank.
    stop:
        0: Show until
        1: If you want to prevent the event from showing on the website after a certain date/time, you can enter it here. Otherwise, leave the field blank.
    tstamp:
        0: Revision date
        1: Date and time of the latest revision
    title_legend: Title and author
    date_legend: Date and time
    details_legend: Event details
    text_legend: Event text
    image_legend: Image settings
    recurring_legend: Recurrence settings
    enclosure_legend: Enclosures
    source_legend: Redirect target
    meta_legend: Metadata
    expert_legend: Expert settings
    publish_legend: Publish settings
    days: day(s)
    weeks: week(s)
    months: month(s)
    years: year(s)
    new:
        1: Create a new event
    show:
        1: Show the details of event ID %s
    versions:
        1: Show the versions of event ID %s
    edit:
        1: Edit event ID %s
    children:
        0: Content elements
        1: Edit the content elements of event ID %s
    copy:
        1: Copy event ID %s
    cut:
        1: Move event ID %s
    delete:
        1: Delete event ID %s
    toggle:
        0: Publish/unpublish event
        1: Unpublish event ID %s
        2: Publish event ID %s
        3: Unpublish
        4: Publish
    feature:
        0: Feature/unfeature event ID %s
        1: Unfeature event ID %s
        2: Feature event ID %s
        3: Unfeature
        4: Feature
    pasteafter:
        0: Paste into this calendar
    tableLabel: Event
