tl_module:
    cal_calendar:
        - Calendars
        - Please select one or more calendars.
    cal_noSpan:
        - Shortened view
        - Show events only once even if they span multiple days.
    cal_hideRunning:
        - Hide running events
        - Do not show running events in the list of upcoming events.
    cal_startDay:
        - Week start day
        - Here you can choose the week start day.
    cal_format:
        - Event list format
        - Here you can choose the event list format.
    cal_ignoreDynamic:
        - Ignore URL parameters
        - Do not switch the time period based on the date/month/year URL parameters.
    cal_order:
        - Sort order
        - Here you can choose the sort order.
    cal_readerModule:
        - Event reader module
        - Automatically switch to the event reader if an event has been selected.
    cal_limit:
        - Number of events
        - Here you can limit the number of events. Enter 0 to show all.
    cal_template:
        - Event template
        - Here you can select an event template.
    cal_ctemplate:
        - Calendar template
        - Here you can select a calendar template.
    cal_showQuantity:
        - Show number of events
        - Show the number of events of each month in the menu.
    cal_featured:
        - Featured events
        - Here you can choose how featured events are handled.
    cal_keepCanonical:
        - Use the current URL for canonical links
        - Keep the current URL instead of the configured reader page for canonical links.
    cal_overview_legend: Overview page
    cal_list: Event list
    cal_day: Day
    cal_month: Month
    cal_year: Year
    cal_all: All events
    cal_upcoming: Upcoming events
    next_7: + 1 week
    next_14: + 2 weeks
    next_30: + 1 month
    next_90: + 3 months
    next_180: + 6 months
    next_365: + 1 year
    next_two: + 2 years
    next_cur_month: of the current month
    next_cur_year: of the current year
    next_next_month: of the next month
    next_next_year: of the next year
    next_all: All upcoming events
    cal_past: Past events
    past_7: '- 1 week'
    past_14: '- 2 weeks'
    past_30: '- 1 month'
    past_90: '- 3 months'
    past_180: '- 6 months'
    past_365: '- 1 year'
    past_two: '- 2 years'
    past_cur_month: of the current month
    past_cur_year: of the current year
    past_prev_month: of the previous month
    past_prev_year: of the previous year
    past_all: All past events
    events:
        all_items: Show all events
        featured: Show featured events only
        unfeatured: Skip featured events
