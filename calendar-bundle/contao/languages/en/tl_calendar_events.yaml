tl_calendar_events:
    title:
        - Title
        - Please enter the event title.
    alias:
        - Event alias
        - The event alias is a unique reference to the event which can be called instead of its numeric ID.
    author:
        - Author
        - Here you can change the author of the event.
    addTime:
        - Add time
        - Add a start and end time to the event.
    startTime:
        - Start time
        - Please enter the start time according to the global time format.
    endTime:
        - End time
        - Leave blank to create an open-ended event.
    startDate:
        - Start date
        - Please enter the start date according to the global date format.
    endDate:
        - End date
        - Leave blank to create a single day event.
    pageTitle:
        - Meta title
        - Here you can add a custom meta title to overwrite the default page title.
    robots:
        - Robots tag
        - Here you can overwrite how search engines handle the event.
    description:
        - Meta description
        - Here you can add a custom meta description to overwrite the default page description.
    canonicalLink:
        - Canonical URL
        - Here you can set a custom canonical URL like https://example.com/.
    location:
        - Location name
        - Here you can enter the name of the event location.
    address:
        - Location address
        - Here you can enter the address of the event location.
    teaser:
        - Event teaser
        - The event teaser can be shown in an event list instead of the full article. A "read more …" link will be added automatically.
    details:
        - Event text
        - Here you can enter the event text.
    addImage:
        - Add an image
        - Add an image to the event.
    recurring:
        - Repeat event
        - Create a recurring event.
    repeatEach:
        - Interval
        - Here you can set the recurrence interval.
    recurrences:
        - Recurrences
        - Set to 0 for unlimited recurrences.
    repeatEnd: End of recurring event
    addEnclosure:
        - Add enclosures
        - Add one or more downloadable files to the event.
    enclosure:
        - Enclosures
        - Please choose the files you want to attach.
    source:
        - Redirect target
        - Here you can override the default redirect target.
    default:
        - Use default
        - By clicking the "read more …" button, visitors will be redirected to the default page of the calendar.
    internal:
        - Page
        - By clicking the "read more …" button, visitors will be redirected to an internal page.
    article:
        - Article
        - By clicking the "read more …" button, visitors will be redirected to an article.
    external:
        - Custom URL
        - By clicking the "read more …" button, visitors will be redirected to custom URL.
    linkText:
        - Link text
        - Here you can override the default "read more…" link text.
    jumpTo:
        - Redirect page
        - Please choose the page to which visitors will be redirected when clicking the event.
    articleId:
        - Article
        - Please choose the article to which visitors will be redirected when clicking the event.
    cssClass:
        - CSS class
        - Here you can enter one or more classes.
    featured:
        - Feature event
        - Show the event in a featured event list.
    published:
        - Publish event
        - Make the event publicly visible on the website.
    start:
        - Show from
        - If you want to prevent the event from showing on the website before a certain date/time, you can enter it here. Otherwise, leave the field blank.
    stop:
        - Show until
        - If you want to prevent the event from showing on the website after a certain date/time, you can enter it here. Otherwise, leave the field blank.
    tstamp:
        - Revision date
        - Date and time of the latest revision
    title_legend: Title and author
    date_legend: Date and time
    details_legend: Event details
    text_legend: Event text
    image_legend: Image settings
    recurring_legend: Recurrence settings
    enclosure_legend: Enclosures
    source_legend: Redirect target
    meta_legend: Metadata
    expert_legend: Expert settings
    publish_legend: Publish settings
    days: day(s)
    weeks: week(s)
    months: month(s)
    years: year(s)
    new:
        1: Create a new event
    show:
        1: Show the details of event ID %s
    versions:
        1: Show the versions of event ID %s
    edit:
        1: Edit event ID %s
    children:
        - Content elements
        - Edit the content elements of event ID %s
    copy:
        1: Copy event ID %s
    cut:
        1: Move event ID %s
    delete:
        1: Delete event ID %s
    toggle:
        - Publish/unpublish event
        - Unpublish event ID %s
        - Publish event ID %s
        - Unpublish
        - Publish
    feature:
        - Feature/unfeature event ID %s
        - Unfeature event ID %s
        - Feature event ID %s
        - Unfeature
        - Feature
    pasteafter:
        - Paste into this calendar
    tableLabel: Event
